<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <main>
    <label for="number">Write a number:</label>
    <input type="number" id="number" required placeholder="Write a number">
    <input type="button" value="send" onclick="powNumber()">
    <div id="answer"></div>

    <label for="year">Write current year:</label>
    <input type="number" id="year" required placeholder="Write current year">

    <label for="born">Write your born year:</label>
    <input type="number" id="born" required placeholder="Write your born year">
    <input type="button" value="send" onclick="calculateage()">
    <div id="age"></div>

    <label for="distance">Write kilometers of location:</label>
    <input type="number" id="distance" required placeholder="Write kilometers">

    <label for="speed">Write current speed</label>
    <input type="number" id="speed" required placeholder="Write current speed">
    <input type="button" value="send" onclick="timeToArrive()">
    <div id="time"></div>

    <label for="paycheck">Write your sales:</label>
    <input type="number" id="paycheck" required placeholder="Write sales">
    
    <input type="button" value="send" onclick="salary()">
    <div id="cash"></div>

    <label for="first">Write your grades:</label>
    <input type="number" id="first" required placeholder="Write your grade">

    <label for="second">Write your grades:</label>
    <input type="number" id="second" required placeholder="Write your grade">

    <label for="third">Write your grades:</label>
    <input type="number" id="thrid" required placeholder="Write your grade">
    
    <input type="button" value="send" onclick="average()">
    <div id="result"></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
