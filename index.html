<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <main>
    <label for="number">Write a number:</label>
    <input type="number" id="number" required placeholder="Write a number">
    <input type="button" value="send" onclick="powNumber()">
    <div id="answer"></div>

    <label for="year">Write current year:</label>
    <input type="number" id="year" required placeholder="Write current year">

    <label for="born">Write your born year:</label>
    <input type="number" id="born" required placeholder="Write your born year">
    <input type="button" value="send" onclick="calculateage()">
    <div id="age"></div>

    <label for="distance">Write kilometers of location:</label>
    <input type="number" id="distance" required placeholder="Write kilometers">

    <label for="speed">Write current speed</label>
    <input type="number" id="speed" required placeholder="Write current speed">
    <input type="button" value="send" onclick="timeToArrive()">
    <div id="time"></div>

    <label for="paycheck">Write your sales:</label>
    <input type="number" id="paycheck" required placeholder="Write sales">
    
    <input type="button" value="send" onclick="salary()">
    <div id="cash"></div>

    <label for="first">Write your grades:</label>
    <input type="number" id="first" required placeholder="Write your grade">

    <label for="second">Write your grades:</label>
    <input type="number" id="second" required placeholder="Write your grade">

    <label for="third">Write your grades:</label>
    <input type="number" id="thrid" required placeholder="Write your grade">
    
    <input type="button" value="send" onclick="average()">
    <div id="result"></div>

    <label for="meters">Write the total meters:</label>
    <input type="number" id="meters" required placeholder="Write the total meters">
    
    <label for="covered">Write the covered meters:</label>
    <input type="number" id="covered" required placeholder="Write the covered meters">
    
    <input type="button" value="send" onclick="squaremeters()">
    <div id="percentresult"></div>
    <div id="uncover"></div>

    <label for="total">Write the total of your purchase:</label>
    <input type="number" id="total" required placeholder="Write the total">
    
    <input type="button" value="send" onclick="discount()">
    <div id="totaldiscount"></div>

    <label for="totalmen">Write the total of men:</label>
    <input type="number" id="totalmen" required placeholder="Write the total men">

    <label for="totalwomen">Write the total of women:</label>
    <input type="number" id="totalwomen" required placeholder="Write the total women">
    
    <input type="button" value="send" onclick="totalgener()">
    <div id="resultmen"></div>
    <div id="resultwomen"></div>

    <label for="totalmen">Write the first number:</label>
    <input type="number" id="numberone" required placeholder="Write the first number">
    
    <label for="totalwomen">Write the second number:</label>
    <input type="number" id="numbertwo" required placeholder="Write the second number">
    
    <input type="button" value="send" onclick="operations()">
    <div id="add"></div>
    <div id="subtract"></div>
    <div id="multiply"></div>
    <div id="division"></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
