<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <label for="one"> Write the first number </label>
    <input type="number" name="one" id="one" placeholder="Write the first number" >
    <label for="two"> Write the second number </label>
    <input type="number" name="two" id="two" placeholder="Write the second number" >
    <input type="button" value="submit" onclick="greater()">

    <label for="lone"> Write the first number </label>
    <input type="number" name="lone" id="lone" placeholder="Write the first number">
    <label for="ltwo"> Write the second number </label>
    <input type="number" name="ltwo" id="ltwo" placeholder="Write the second number">
    <input type="button" value="submit" onclick="lower()">
    <div id="lowernumber"></div>

    <label for="gone"> Write the first number </label>
    <input type="number" name="gone" id="gone" placeholder="Write the first number">
    <label for="gtwo"> Write the second number </label>
    <input type="number" name="gtwo" id="gtwo" placeholder="Write the second number">
    <input type="button" value="submit" onclick="greaterorequal()">
    <div id="numbergreaterorequal"></div>

    <form id="number-checker-form">
      <div class="form-group">
        <label for="first-number">First Number</label>
        <input type="number" id="first-number" name="first-number" placeholder="Enter the first number" step="any">
      </div>

      <div class="form-group">
        <label for="second-number">Second Number</label>
        <input type="number" id="second-number" name="second-number" placeholder="Enter the second number" step="any">
      </div>

      <button type="button" id="check-button" onclick="checkNumbers()">Check Numbers</button>
    </form>

    <div id="result-display"></div>

    <form id="number-checker-form">
      <div class="form-group">
        <label for="even-number">First Number</label>
        <input type="number" id="even-number" name="even-number" placeholder="Enter the first number" step="any">
      </div>
    
      <div class="form-group">
        <label for="evensecond-number">Second Number</label>
        <input type="number" id="evensecond-number" name="evensecond-number" placeholder="Enter the second number" step="any">
      </div>
    
      <button type="button" id="checkevenOrodd-button" onclick="evenOrodd()">Check Even or Odd Numbers</button>
    </form>
    
    <div id="display"></div>

    <form id="number-checker-form">
      <div class="form-group">
        <label for="purchase-amount">Checker discount</label>
        <input type="number" id="purchase-amount" name="purchase-amount" placeholder="Enter the purchase" step="any">
      </div>
    
    
      <button type="button" id="checkdiscount-button" onclick="deduct()">Check Discunt</button>
    </form>
    
    <div id="discount"></div>

    <form id="High-number-form">
      <div class="form-group">
        <label for="first-number">First Number</label>
        <input type="number" id="first" name="first-number" placeholder="Enter the first number" step="any">
      </div>
    
      <div class="form-group">
        <label for="second-number">Second Number</label>
        <input type="number" id="second" name="second-number" placeholder="Enter the second number" step="any">
      </div>

      <div class="form-group">
        <label for="third-number">Third Number</label>
        <input type="number" id="third" name="third-number" placeholder="Enter the third number" step="any">
      </div>

      <div class="form-group">
        <label for="fourth-number">Fourth Number</label>
        <input type="number" id="fourth" name="fourth-number" placeholder="Enter the fourth number" step="any">
      </div>
    
      <button type="button" id="highnumber-button" onclick="HighNumber()">Check High Number</button>
    </form>
    
    <div id="highnumber"></div>

    <form id="Low-number-form">
      <div class="form-group">
        <label for="lfirst-number">First Number</label>
        <input type="number" id="lfirst" name="lfirst-number" placeholder="Enter the first number" step="any">
      </div>
    
      <div class="form-group">
        <label for="lsecond-number">Second Number</label>
        <input type="number" id="lsecond" name="lsecond-number" placeholder="Enter the second number" step="any">
      </div>
    
      <div class="form-group">
        <label for="lthird-number">Third Number</label>
        <input type="number" id="lthird" name="lthird-number" placeholder="Enter the third number" step="any">
      </div>
    
      <div class="form-group">
        <label for="lfourth-number">Fourth Number</label>
        <input type="number" id="lfourth" name="lfourth-number" placeholder="Enter the fourth number" step="any">
      </div>
    
      <button type="button" id="lownumber-button" onclick="LowNumber()">Check Low Number</button>
    </form>
    
    <div id="lownumber"></div>

    <form id="High-number-form">
      <div class="form-group">
        <label for="hlfirst-number">First Number</label>
        <input type="number" id="hlfirst" name="hlfirst-number" placeholder="Enter the first number" step="any">
      </div>
    
      <div class="form-group">
        <label for="hlsecond-number">Second Number</label>
        <input type="number" id="hlsecond" name="hlsecond-number" placeholder="Enter the second number" step="any">
      </div>
    
      <div class="form-group">
        <label for="hlthird-number">Third Number</label>
        <input type="number" id="hlthird" name="hlthird-number" placeholder="Enter the third number" step="any">
      </div>
    
      <div class="form-group">
        <label for="hlfourth-number">Fourth Number</label>
        <input type="number" id="hlfourth" name="hlfourth-number" placeholder="Enter the fourth number" step="any">
      </div>

      <div class="form-group">
        <label for="hlfiveth-number">Fiveth Number</label>
        <input type="number" id="hlfiveth" name="hlfiveth-number" placeholder="Enter the fiveth number" step="any">
      </div>
    
      <button type="button" id="hlnumber-button" onclick="HighOrlowerNumber()">Check high or lower Number</button>
    </form>
    
    <div id="hldisplay"></div>

    <form id="Filter-number-form">
      <div class="form-group">
        <label for="ffirst-number">First Number</label>
        <input type="number" id="ffirst" name="ffirst-number" placeholder="Enter the first number" step="any">

      <div class="form-group">
        <label for="fsecond-number">Second Number</label>
        <input type="number" id="fsecond" name="fsecond-number" placeholder="Enter the second number" step="any">
      </div>
    
      <div class="form-group">
        <label for="fthird-number">Third Number</label>
        <input type="number" id="fthird" name="fthird-number" placeholder="Enter the third number" step="any">
      </div>
    
      <div class="form-group">
        <label for="ffourth-number">Fourth Number</label>
        <input type="number" id="ffourth" name="ffourth-number" placeholder="Enter the fourth number" step="any">
      </div>
    
      <button type="button" id="filternumber-button" onclick="Filternumber()">Filter number highest than one hundred</button>
    </form>
    
    <div id="filter"></div>

    <form id="Lowes-number-than-one-hundred-form">
      <div class="form-group">
        <label for="lohfirst-number">First Number</label>
        <input type="number" id="lohfirst" name="lohfirst-number" placeholder="Enter the first number" step="any">

      <div class="form-group">

        <input type="number" id="lohthird" name="lohthird-number" placeholder="Enter the third number" step="any">

      <div class="form-group">
        <label for="lohfourth-number">Fourth Number</label>
        <input type="number" id="lohfourth" name="lohfourth-number" placeholder="Enter the fourth number" step="any">
      </div>
    
      <button type="button" id="lowestnumberthanonehundred-button">Show lowest number than 100</button>
    </form>
    
    <div id="lowestnumber"></div>

    <form id="Conversion-form">
      <div class="form-group">
        <label for="minutes">Minutes or Hours</label>
        <input type="number" id="minutes" name="minutes" placeholder="Enter the minutes" step="any">
      </div>
    
      <button type="button" id="conversion-button">Get your hours or minutes</button>
    </form>
    
    <div id="conversion"></div>
  </main>
  <script src="main.js"></script>
</body>
</html>
